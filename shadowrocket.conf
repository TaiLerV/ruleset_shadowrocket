#!name=Shadowrocket (mihomo port)
#!desc=Порт правил из конфига mihomo/Remnawave: YouTube, Telegram, Discord, WhatsApp/Meta, ru-bundle, Cloudflare, RKN ASN -> VPN; торренты, игры, остальное -> напрямую; реклама -> REJECT.
#!note=Списки: https://github.com/TaiLerV/ruleset_shadowrocket (ветка main, папка rule-sets).

[General]
# IPv6 включён, как в mihomo. Списки содержат IPv6-подсети, теперь они работают.
ipv6 = true
# AAAA в приоритете над A. Если на мобильном интернете полезут таймауты
# или отвалится часть сайтов – первым делом возвращай prefer-ipv6 = false.
prefer-ipv6 = true
private-ip-answer = true
dns-direct-system = false
dns-fallback-system = false
dns-direct-fallback-proxy = true

# Основной резолвер – Cloudflare DoT/DoH, запасной – Яндекс + системный.
# Яндекс не основной из-за НСДИ: резолв заблокированных доменов там может быть подменён,
# а правила по IP (rkn-asnblock, cloudflare) работают только по честному ответу DNS.
dns-server = tls://1.1.1.1:853,tls://1.0.0.1:853,https://security.cloudflare-dns.com/dns-query,1.1.1.1,1.0.0.1
fallback-dns-server = tls://77.88.8.8:853,77.88.8.8,system

hijack-dns = :53
# Подсети отсюда убраны: они уже в tun-excluded-routes ниже. Остались только домены.
skip-proxy = localhost,*.local,captive.apple.com
tun-excluded-routes = 10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32,239.255.255.250/32,::1/128,fc00::/7,fe80::/10,ff00::/8
icmp-auto-reply = false
always-reject-url-rewrite = false
udp-policy-not-supported-behaviour = REJECT

# Опционально: группа из подписки Remnawave вместо ручного выбора сервера.
# Если включаешь – раскомментируй блок ниже и замени во всех правилах PROXY на "🌍 VPN".
# [Proxy Group]
# 🌍 VPN = select, policy-path=https://ТВОЯ_ССЫЛКА_ПОДПИСКИ, update-interval=86400

[Rule]
# Правил на локальные подсети здесь нет: этот трафик отсекается
# на уровне маршрутизации через tun-excluded-routes и до [Rule] не доходит.

# --- приватные/локальные домены (аналог geosite-private) ---
RULE-SET,https://raw.githubusercontent.com/TaiLerV/ruleset_shadowrocket/main/rule-sets/geosite-private.list,DIRECT

# --- аналог apps_ipcheck + пара доменов из mihomo ---
DOMAIN,docs.rw,PROXY
DOMAIN,xtls.github.io,PROXY
DOMAIN,ipwho.is,PROXY
DOMAIN,api.ip.sb,PROXY
DOMAIN,ipapi.co,PROXY
DOMAIN,ipinfo.io,PROXY
DOMAIN,ip-api.com,PROXY

# --- реклама и трекеры (category-ads-all) ---
RULE-SET,https://raw.githubusercontent.com/TaiLerV/ruleset_shadowrocket/main/rule-sets/ads-all.list,REJECT

# --- торрент-трекеры – мимо VPN ---
RULE-SET,https://raw.githubusercontent.com/TaiLerV/ruleset_shadowrocket/main/rule-sets/torrent-trackers.list,DIRECT

# --- игровые домены – мимо VPN (PROCESS-NAME правила на iOS не работают) ---
RULE-SET,https://raw.githubusercontent.com/TaiLerV/ruleset_shadowrocket/main/rule-sets/games-direct.list,DIRECT

# --- YouTube ---
RULE-SET,https://raw.githubusercontent.com/TaiLerV/ruleset_shadowrocket/main/rule-sets/youtube.list,PROXY

# --- WhatsApp ---
RULE-SET,https://raw.githubusercontent.com/TaiLerV/ruleset_shadowrocket/main/rule-sets/whatsapp-domains.list,PROXY

# --- Telegram (домены) ---
RULE-SET,https://raw.githubusercontent.com/TaiLerV/ruleset_shadowrocket/main/rule-sets/telegram-domains.list,PROXY

# --- Discord (домены) ---
RULE-SET,https://raw.githubusercontent.com/TaiLerV/ruleset_shadowrocket/main/rule-sets/discord-domains.list,PROXY

# --- ru-bundle: заблокированное в РФ + ушедшее из РФ ---
RULE-SET,https://raw.githubusercontent.com/TaiLerV/ruleset_shadowrocket/main/rule-sets/ru-bundle.list,PROXY

# --- Meta/Facebook (IP) ---
RULE-SET,https://raw.githubusercontent.com/TaiLerV/ruleset_shadowrocket/main/rule-sets/meta-ips.list,PROXY

# --- Telegram (IP) ---
RULE-SET,https://raw.githubusercontent.com/TaiLerV/ruleset_shadowrocket/main/rule-sets/telegram-ips.list,PROXY

# --- Discord voice (IP) ---
RULE-SET,https://raw.githubusercontent.com/TaiLerV/ruleset_shadowrocket/main/rule-sets/discord-voice-ips.list,PROXY

# --- Cloudflare (IP) ---
RULE-SET,https://raw.githubusercontent.com/TaiLerV/ruleset_shadowrocket/main/rule-sets/cloudflare-ips.list,PROXY

# --- подсети ASN, блокируемые РКН ---
RULE-SET,https://raw.githubusercontent.com/TaiLerV/ruleset_shadowrocket/main/rule-sets/rkn-asnblock.list,PROXY

# --- всё остальное напрямую (аналог MATCH,♻️ БезVPN) ---
FINAL,DIRECT
